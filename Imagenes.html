<!DOCTYPE html> <!-- Con esto le decimos al navegador que estamos usando HTML5 -->
<html lang="en"> <!-- Lenguaje de la pagina -->
<head> <!-- Configuracion de la pagina, lo que no se ve en pantalla -->
    <meta charset="UTF-8"> <!-- Esta linea permite al navegador agregar caracteres especiales -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Es para que la pagina se adapte a diferentes pantallas -->
    <title>Imagenes en HTML</title> <!-- Titulo en la pestaña de la ventana -->
</head> <!-- Cerramos el encabezado -->
<body> <!-- Cuerpo de la pagina -->
    <h2>Imagenes en HTML</h2> <!-- Subtitulo principal -->
    <h3>Locales</h3> <!-- Subtitulo menos importante -->
    <img src="caritas.png" alt="Imagen de carita feliz"> <!-- Muestra una imagen que esta en la misma carpeta del proyecto -->
    <h3>Locales redismensionado</h3> <!-- Subtitulo menos importante -->
    <img src="imagenes/carita.png" alt="" width="200" height="100"> <!-- Imagen dentro de una subcarpeta con el ancho y alto personalizados -->
    <h3>Desde internet</h3> <!-- Subtitulo menos importante para imagenes sacadas de la web -->
    <img src="https://st2.depositphotos.com/2172759/11751/v/950/depositphotos_117511772-stock-illustration-happy-face-isolated-on-white.jpg" 
    width="200" height="200"
    alt=""> <!-- Muestra una imagen  de la web con el ancho y alto personalizados -->
    <h3>Animaciones</h3> <!-- Subtitulo menos importante para imagenes en movimiento -->
    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejMydmVybzBiY3lkdWd1Nnp1MzJiMXA3Ymt3czE3NGp1NDZuZDg5YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/tXL4FHPSnVJ0A/giphy.gif" 
    width="200" height="200"
    alt=""> <!-- Inserta una imagen animada en formato GIF desde internet con el ancho y el altro personalizados -->
</body> <!-- Cerramos el cuerpo -->
</html> <!-- Cerramos el documento HTML -->
